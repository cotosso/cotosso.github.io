<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NethSecurity 8 · Log e report v2 (prototipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
--page:#f9fafb;--card:#fff;--card2:#f3f4f6;--bd:#e5e7eb;--bd2:#d1d5db;
--tx:#111827;--tx2:#6b7280;--tx3:#9ca3af;
--pri:#4f46e5;--pri-bg:#eef2ff;--pri-bd:#c7d2fe;--tl:#0d9488;
--dg:#dc2626;--dg-bg:#fef2f2;--dg-fill:#ef4444;--dg-bd:#fecaca;
--wr:#b45309;--wr-bg:#fffbeb;--wr-fill:#f59e0b;--wr-bd:#fde68a;
--ok:#047857;--ok-bg:#ecfdf5;
--nav:#1f2937;--nav-tx2:#9ca3af;
--sans:'Poppins','Inter',ui-sans-serif,system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
html[data-dark]{
--page:#111827;--card:#1f2937;--card2:#374151;--bd:#374151;--bd2:#4b5563;
--tx:#f3f4f6;--tx2:#9ca3af;--tx3:#6b7280;
--pri:#818cf8;--pri-bg:#312e81;--pri-bd:#4338ca;
--dg:#f87171;--dg-bg:#450a0a;--dg-bd:#7f1d1d;--wr:#fbbf24;--wr-bg:#451a03;--wr-bd:#78350f;--ok:#34d399;--ok-bg:#064e3b;
--nav:#0b1220;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--tx);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
a{color:var(--pri)}
.app{display:flex;min-height:100vh}
.nav{width:212px;flex:none;background:var(--nav);color:var(--nav-tx2);padding:14px 0;position:sticky;top:0;height:100vh;overflow:auto}
.nav .brand{display:flex;align-items:center;gap:9px;padding:0 16px 16px;font-weight:500;color:#fff;font-size:15px}
.nav .logo{width:24px;height:24px;border-radius:6px;background:var(--pri);display:grid;place-items:center;color:#fff;font-size:12px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 16px;color:var(--nav-tx2);text-decoration:none;font-size:13px}
.nav a.on{color:#fff;background:rgba(255,255,255,.08);box-shadow:inset 2px 0 0 var(--pri)}
.nav a:hover{color:#fff}
.nav .grp{padding:14px 16px 5px;font-size:11px;color:#6b7280}
.main{flex:1;min-width:0}
.top{height:52px;border-bottom:1px solid var(--bd);background:var(--card);display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:10}
.gsearch{flex:1;max-width:420px;height:34px;border:1px solid var(--bd2);border-radius:6px;background:var(--card);display:flex;align-items:center;gap:7px;padding:0 10px}
.gsearch:focus-within{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-bg)}
.gsearch input{flex:1;border:0;background:none;outline:none}
.wrap{padding:20px 24px 48px;max-width:1400px}
h1{font-size:22px;font-weight:500;margin:0}
h2{font-size:15px;font-weight:500;margin:0}
.crumb{font-size:12px;color:var(--tx3);margin-bottom:3px}
.crumb a{text-decoration:none}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--bd);margin:16px 0 18px}
.tab{padding:9px 0;font-size:14px;color:var(--tx2);cursor:pointer;border:0;border-bottom:2px solid transparent;background:none}
.tab.on{color:var(--tx);font-weight:500;border-bottom-color:var(--pri)}
.btn{height:34px;padding:0 11px;border:1px solid var(--bd2);border-radius:6px;background:var(--card);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--card2)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.sm{height:28px;font-size:12px;padding:0 9px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px}
.pad{padding:14px 16px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.sec{font-size:11px;color:var(--tx3);margin:0 0 7px}
.small{font-size:12px}.mini{font-size:11px;color:var(--tx3)}.muted{color:var(--tx2)}
svg.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ins{display:flex;gap:11px;padding:12px 14px;align-items:flex-start;border-top:1px solid var(--bd)}
.ins:first-child{border-top:0}
.ins.d{border-left:3px solid var(--dg-fill)}
.ins.w{border-left:3px solid var(--wr-fill)}
.ins.n{border-left:3px solid var(--bd2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:9px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.tile:hover{border-color:var(--pri);background:var(--pri-bg)}
.verd{border-radius:10px;padding:12px 14px;margin-bottom:14px;border:1px solid}
.verd.d{background:var(--dg-bg);border-color:var(--dg-bd);color:var(--dg)}
.verd.w{background:var(--wr-bg);border-color:var(--wr-bd);color:var(--wr)}
.verd.n{background:var(--card2);border-color:var(--bd);color:var(--tx)}
.verd .s{font-size:12px;margin-top:3px;opacity:.9}
.qbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.qbox{flex:1;min-width:270px;min-height:36px;border:1px solid var(--bd2);border-radius:6px;background:var(--card);display:flex;align-items:center;gap:6px;padding:4px 10px;flex-wrap:wrap}
.qbox:focus-within{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-bg)}
.qbox input{flex:1;min-width:120px;border:0;background:none;outline:none;height:26px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--pri-bg);color:var(--pri);border:1px solid var(--pri-bd);font-size:12px;padding:2px 7px;border-radius:5px}
.chip button{border:0;background:none;cursor:pointer;color:inherit;padding:0;display:grid;place-items:center}
.sel{height:36px;border:1px solid var(--bd2);border-radius:6px;background:var(--card);padding:0 8px}
.grid{display:grid;grid-template-columns:212px minmax(0,1fr);gap:18px;align-items:start}
.fx{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-size:13px;color:var(--tx2);cursor:pointer}
.fx:hover{color:var(--tx)}.fx.on{color:var(--pri)}
.fx .cb{width:13px;height:13px;border:1px solid var(--bd2);border-radius:3px;display:inline-grid;place-items:center;margin-right:7px;vertical-align:-2px}
.fx.on .cb{background:var(--pri);border-color:var(--pri);color:#fff}
.fx .n{color:var(--tx3);font-size:12px;font-variant-numeric:tabular-nums}
.histo{display:flex;align-items:flex-end;gap:2px;height:70px;user-select:none;cursor:crosshair}
.hb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:1px;min-width:2px}
.hb i{display:block;border-radius:2px}
.hb.off{opacity:.28}
table.ev{width:100%;border-collapse:collapse;table-layout:fixed}
table.ev th{text-align:left;font-weight:400;font-size:11px;color:var(--tx3);padding:8px 10px;border-bottom:1px solid var(--bd);background:var(--card2)}
table.ev td{padding:8px 10px;border-bottom:1px solid var(--bd);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.ev tr.r{cursor:pointer}
table.ev tr.r:hover td{background:var(--card2)}
table.ev tr.r.sel td{background:var(--pri-bg)}
.mono{font-family:var(--mono);font-size:12px}
.sv{display:inline-block;width:6px;height:6px;border-radius:50%;vertical-align:1px;margin-right:6px}
.pill{font-size:11px;padding:2px 6px;border-radius:5px;white-space:nowrap}
.p-drop{background:var(--dg-fill);color:#fff}.p-allow{background:var(--ok-bg);color:var(--ok)}
.p-warn{background:var(--wr-bg);color:var(--wr)}.p-diff{background:var(--pri-bg);color:var(--pri)}
.cnt{background:var(--card2);color:var(--tx2);font-size:11px;padding:1px 5px;border-radius:4px;margin-left:6px}
.kpi{background:var(--card2);border-radius:8px;padding:10px 12px}
.kpi .l{font-size:12px;color:var(--tx2)}.kpi .v{font-size:22px;font-weight:500;line-height:1.3}
.bar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri)}
.lst{font-size:13px}
.lst div.i{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.lst div.i:last-child{border-bottom:0}
.lnk{color:var(--pri);cursor:pointer}
.dr{position:fixed;top:0;right:0;bottom:0;width:470px;max-width:94vw;background:var(--card);border-left:1px solid var(--bd);box-shadow:-8px 0 24px rgba(0,0,0,.09);transform:translateX(103%);transition:transform .18s ease;z-index:40;display:flex;flex-direction:column}
.dr.open{transform:none}
.dr .hd{padding:13px 16px;border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:flex-start}
.dr .bd{padding:14px 16px;overflow:auto}
.kv{display:grid;grid-template-columns:112px minmax(0,1fr);gap:6px 10px;font-size:13px}
.kv dt{color:var(--tx2)}.kv dd{margin:0;word-break:break-all}
.raw{background:var(--card2);border-radius:6px;padding:9px 10px;font-family:var(--mono);font-size:11.5px;line-height:1.65;word-break:break-all;color:var(--tx2)}
.dot{border-bottom:1px dotted var(--tx3);cursor:help}
.steps{font-size:13px;line-height:1.85}
.steps b{font-weight:400;color:var(--tx2);margin-right:5px}
.empty{text-align:center;padding:34px 20px}
.sw{width:38px;height:21px;border-radius:11px;background:var(--bd2);position:relative;cursor:pointer;border:0;padding:0;flex:none}
.sw i{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--tl)}.sw.on i{left:19px}
.banner{display:flex;gap:10px;padding:11px 13px;border-radius:8px;font-size:13px;align-items:flex-start;border:1px solid}
.banner.w{background:var(--wr-bg);border-color:var(--wr-bd);color:var(--wr)}
@media (max-width:1000px){.grid{grid-template-columns:1fr}.nav{width:58px}.nav a span,.nav .brand span,.nav .grp{display:none}}
</style>
</head>

"use strict";
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var R=rng(20260907);
function pick(a){return a[Math.floor(R()*a.length)]}
function ri(a,b){return a+Math.floor(R()*(b-a+1))}
function p2(n){return n<10?'0'+n:''+n}
function hms(d){return p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())}
function nf(n){return n.toLocaleString('it-IT')}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fill(t,e){return String(t).replace(/\{(\w+)\}/g,function(m,k){return e[k]!=null&&e[k]!==''?e[k]:'—'})}

'fw.state.invalid':{cat:'Firewall',cons:'degraded',act:'drop',noise:'medium',

'dpi.app.blocked':{cat:'DPI e app',cons:'blocked',act:'drop',noise:'medium',

'vpn.ipsec.child.rekey':{cat:'VPN',cons:'info',act:'warn',noise:'high',

 steps:['Ignoralo se isolato.','Se le occorrenze sono decine al giorno, indaga la qualità della linea del tunnel {tunnel}.']},
'vpn.ipsec.tunnel.down':{cat:'VPN',cons:'degraded',act:'warn',noise:'low',
 label:'Tunnel IPsec caduto',
 mean:'Il tunnel {tunnel} non è più attivo: la sede remota non è raggiungibile.',

'audit.config.changed':{cat:'Modifiche',cons:'change',act:'diff',noise:'medium',

};

function simulate(p){

 if(BAD.indexOf(p.src)>-1){
  st.push({k:'no',t:'Threat Shield IP: la sorgente è in blocklist, pacchetto scartato prima delle regole',

 }
 st.push({k:'ok',t:'Threat Shield IP: sorgente non presente in nessuna blocklist'});
 st.push({k:'ok',t:'Conntrack: nuova sessione, nessuna corrispondenza con connessioni esistenti'});
 if(p.iface===DNAT.iface&&p.proto===DNAT.proto&&String(p.dport)===String(DNAT.dport)&&FWIP[dst]){
  rewrote={from:dst+':'+dport,to:DNAT.toIp+':'+DNAT.toPort};

 }else{

 }

 var pk={proto:p.proto,dport:dport,dst:dst,src:p.src};

  if(skipped)st.push({k:'warn',t:'Filtro applicativo '+skipped.n+' presente su questa catena',s:'Lavora sul flusso e non sul singolo pacchetto: la simulazione non può dire se bloccherebbe questa sessione.'});
  verdict={c:'n',t:'Il pacchetto viene consentito'+(hit?' dalla regola '+hit.n+'.':' dalla politica della zona '+zs+' → '+zd+'.'),
   s:rewrote?'La destinazione è stata riscritta dal NAT: il pacchetto arriva a '+rewrote.to+', non a '+rewrote.from+'. Se il servizio non risponde, il problema è sull\'host interno.':'Se il traffico comunque non passa, guarda il ritorno, il filtro applicativo o il servizio di destinazione.'};
 }else if(hit){
  st.push({k:'off',t:'Politica della zona, postrouting, filtro applicativo',s:'Non raggiunti: la decisione è già stata presa.'});
  verdict={c:'d',t:'Il pacchetto viene '+(hit.act==='drop'?'scartato':'rifiutato')+' dalla regola '+hit.n+'.',
   s:hit.act==='drop'?'Il client non riceve risposta e va in timeout.':'Il client riceve un errore immediato di connessione rifiutata.'};
 }else{

  verdict={c:'d',t:'Nessuna regola corrisponde: decide la politica della zona '+zs+' → '+zd+', impostata su '+pol+'.',
   s:'Non c\'è una regola responsabile da correggere: per consentire questo traffico va aggiunta una regola, non modificata una esistente.'};

 +'</div>';
 if(p.tracing)return h+'<div class="card empty"><div class="muted">Traccia attiva su '+esc(p.src)+' → '+esc(p.dst)+':'+esc(p.dport)+'. In attesa di pacchetti…</div></div>';
 if(!r)return h+'<div class="card empty"><div style="font-size:15px">Inserisci i parametri di un pacchetto e premi Simula.</div><div class="small muted" style="max-width:520px;margin:6px auto 0">La simulazione valuta il ruleset attivo senza generare traffico: utile anche di notte, e soprattutto prima di applicare una modifica.</div></div>';
 h+=(p.trace?'<div class="banner w" style="margin-bottom:12px"><svg class="ic"><path d="M12 4l9 16H3z"/></svg><div>Risultato della traccia reale su un pacchetto osservato alle '+hms(new Date())+'. Include lo stato del conntrack e l\'instradamento effettivo, che la simulazione statica non può conoscere.</div></div>':'')
 +'<div class="verd '+r.v.c+'"><div>'+esc(r.v.t)+'</div><div class="s">'+esc(r.v.s)+'</div></div>'
 +'<div class="card" style="margin-bottom:14px;overflow:hidden">';
 r.st.forEach(function(s,i){
  var col=s.k==='ok'||s.k==='chain-ok'?'var(--ok)':s.k==='no'||s.k==='chain-no'?'var(--dg-fill)':s.k==='nat'||s.k==='warn'?'var(--wr-fill)':'var(--bd2)';
  var icon=s.k==='ok'||s.k==='chain-ok'?'M4 12l5 5L20 6':s.k==='no'?'M6 6l12 12M18 6L6 18':s.k==='nat'?'M4 8h12l-3-3M20 16H8l3 3':s.k==='off'?'M6 12h12':'M12 8v5M12 16h.01';
  h+='<div style="padding:10px 13px;border-top:'+(i?'1px solid var(--bd)':'0')+';border-left:3px solid '+col+';'+(s.k==='off'?'opacity:.55;':'')+'">'
   +'<div style="display:flex;gap:10px;align-items:flex-start"><svg class="ic" style="color:'+col+';margin-top:2px"><path d="'+icon+'"/></svg>'
   +'<div style="flex:1;min-width:0"><div>'+esc(s.t)+'</div>'+(s.s?'<div class="small muted" style="margin-top:2px">'+esc(s.s)+'</div>':'')+'</div></div>';
  if(s.rules){
   h+='<div style="margin-left:26px;margin-top:8px;font-size:12px">';
   s.rules.forEach(function(x){
    h+='<div style="display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd);align-items:baseline">'
     +'<svg class="ic" style="width:13px;height:13px;color:var(--tx3)"><path d="M6 6l12 12M18 6L6 18"/></svg>'
     +'<span style="flex:1;min-width:0">'+esc(x.n)+'</span>'
     +'<span class="muted">'+(x.skip?'valutata sul flusso, non qui':esc(x.w[0])+' '+esc(x.w[1])+' ≠ <span style="color:var(--dg)">'+esc(x.w[2])+'</span>')+'</span></div>';
   });
   if(s.hit)h+='<div style="display:flex;gap:8px;padding:7px 6px;margin:2px -6px 0;align-items:baseline;background:'+(s.hit.act==='accept'?'var(--ok-bg)':'var(--dg-bg)')+';border-radius:6px;color:'+(s.hit.act==='accept'?'var(--ok)':'var(--dg)')+'">'
    +'<svg class="ic" style="width:13px;height:13px"><circle cx="12" cy="12" r="5" fill="currentColor" stroke="none"/></svg>'
    +'<span style="flex:1;min-width:0">'+esc(s.hit.n)+'</span><span>corrisponde su tutti i campi → '+s.hit.act+'</span></div>';
   if(s.pol)h+='<div style="display:flex;gap:8px;padding:7px 6px;margin:2px -6px 0;align-items:baseline;background:var(--dg-bg);border-radius:6px;color:var(--dg)">'
    +'<svg class="ic" style="width:13px;height:13px"><circle cx="12" cy="12" r="5" fill="currentColor" stroke="none"/></svg>'
    +'<span style="flex:1;min-width:0">Politica predefinita della zona</span><span>nessuna regola corrisponde → '+s.pol+'</span></div>';
   h+='</div>';
  }
  h+='</div>';
 });
 h+='</div>';
 if(!p.trace)h+='<div class="banner w" style="margin-bottom:14px"><svg class="ic"><path d="M12 8v5M12 16h.01"/><circle cx="12" cy="12" r="9"/></svg><div>Filtro applicativo e IPS lavorano sul flusso, non sul singolo pacchetto: la simulazione non li valuta. Il risultato riflette la configurazione salvata e riguarda il primo pacchetto di una sessione nuova. Se qui è consentito ma il traffico non passa, usa la traccia reale.</div></div>';
 var ev=simEvents(p);
 h+='<div class="row" style="flex-wrap:wrap">'
 +(r.rule&&r.rule!=='politica di zona'&&r.rule!=='ts-blocklist'?'<button class="btn sm" data-rule="'+esc(r.rule)+'">Apri la regola</button>':'')
 +'<button class="btn sm">'+(r.act==='accept'?'Aggiungi un blocco e risimula':'Crea eccezione e risimula')+'</button>'
 +(ev?'<button class="btn sm" data-simev="1">Eventi reali corrispondenti ('+nf(ev)+')</button>':'<span class="mini">nessun evento reale corrispondente nell\'ultima ora</span>')
 +'<button class="btn sm" id="perma">Copia link</button></div>';
 return h;
}

function drawer(){
 var d=document.getElementById('drawer');
 var e=DATA.concat(LIVE).filter(function(x){return x.id===S.sel})[0];
 if(!e){d.className='dr';d.innerHTML='';return}
 var c=CAT[e.eid], co=CONS[c.cons];
 var raw='kernel: '+(e.act==='allow'?'ALLOW':'DROP')+'-'+e.rule+' IN='+(e.iface||'-')+' OUT= MAC='+(HOSTS[e.src]?HOSTS[e.src].mac:'08:35:71:f0:e4:8a')+':08:00 SRC='+(e.src||'-')+' DST='+(e.dst||'-')+' LEN=58 TTL=64 ID='+ri(1000,60000)+' PROTO='+(e.proto||'-').toUpperCase()+' <span class="dot" title="Porta sorgente">SPT</span>='+e.sport+' <span class="dot" title="Porta di destinazione">DPT</span>='+e.dport;
 var kv=[['Evento',e.eid],['Conseguenza',co.l],['Ora',hms(e.ts)+' · 7 set 2026'],['Sorgente',(e.src||'-')+(e.sport?':'+e.sport:'')],['Host',e.host||'-'],['Destinazione',(e.dst||'-')+(e.dport?':'+e.dport:'')],['Protocollo',e.proto||'-'],['Zona',e.zone||'-'],['Interfaccia',e.iface||'-'],['Regola',e.rule],['Utente',e.user||'-']];
 d.className='dr open';
 d.innerHTML='<div class="hd"><div style="flex:1;min-width:0"><div class="row" style="gap:8px">'+pillOf(e.act)+'<span style="font-weight:500">'+esc(label(e))+'</span></div>'
 +'<div class="small muted" style="margin-top:4px">'+esc(mean(e))+'</div></div>'
 +'<button class="btn sm" id="dc" aria-label="Chiudi"><svg class="ic" style="width:14px;height:14px"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>'
 +'<div class="bd">'
 +'<p class="sec">Evidenza</p><dl class="kv">'+kv.map(function(p){return '<dt>'+p[0]+'</dt><dd>'+esc(p[1])+'</dd>'}).join('')+'</dl>'
 +'<p class="sec" style="margin-top:16px">Riga originale</p><div class="raw">'+raw+'</div>'
 +'<p class="sec" style="margin-top:16px">Cause probabili</p><div class="steps">'+c.causes.map(function(x){return '<div>· '+esc(fill(x,e))+'</div>'}).join('')+'</div>'
 +'<p class="sec" style="margin-top:16px">Come risolvere</p><div class="steps">'+c.steps.map(function(x,i){return '<div><b>'+(i+1)+'.</b>'+esc(fill(x,e))+'</div>'}).join('')+'</div>'
 +'<div class="row" style="margin-top:14px;flex-wrap:wrap">'
 +(e.src&&HOSTS[e.src]?'<button class="btn sm" data-host="'+esc(e.src)+'">Apri '+esc(HOSTS[e.src].n)+'</button>':'')
 +(e.rule&&e.rule!=='-'?'<button class="btn sm" data-rule="'+esc(e.rule)+'">Apri la regola</button>':'')
 +(e.tunnel?'<button class="btn sm" data-tunnel="'+esc(e.tunnel)+'">Apri il tunnel</button>':'')
 +'<button class="btn sm" data-explore-event="'+e.eid+'">Eventi simili</button>'
 +(e.src&&e.dst&&e.dport?'<button class="btn sm" data-sim="1" data-sim-src="'+esc(e.src)+'" data-sim-dst="'+esc(e.dst)+'" data-sim-dport="'+esc(e.dport)+'" data-sim-proto="'+esc(e.proto||'tcp')+'" data-sim-iface="'+esc(e.iface||'eth0')+'">Rigioca nel simulatore</button>':'')
 +'</div><p class="mini" style="margin-top:14px">Testi da catalogo-eventi.yml · voce '+e.eid+'</p></div>';
}

function render(){
 var w=document.getElementById('wrap'),n=S.route.n;
 w.innerHTML=n==='overview'?vOverview():n==='explore'?vExplore():n==='simulate'?vSimulate():n==='live'?vLive():n==='settings'?vSettings():n==='host'?vHost():n==='rule'?vRule():vTunnel();
 var sc=document.getElementById('scope');if(sc)sc.value=S.scope;
 drawer();
}
function readSim(){
 ['src','dst','dport','proto','iface'].forEach(function(k){
  var el=document.getElementById('s-'+k);if(el&&el.value!=null)S.sim[k]=String(el.value).trim();
 });
}
function setFilters(f){S.tokens=f.tokens||[];S.cons=f.cons||[];S.cat=f.cat||[];S.range=null;S.sel=null}

document.getElementById('dk').addEventListener('click',function(){
 var h=document.documentElement;
 if(h.hasAttribute('data-dark'))h.removeAttribute('data-dark');else h.setAttribute('data-dark','1');
});
document.getElementById('gs').addEventListener('keydown',function(ev){
 if(ev.key!=='Enter')return;
 var q=ev.target.value.trim();if(!q)return;
 var ip=HOSTS[q]?q:hostByName(q);
 if(ip)return go('host',ip);
 if(/^\d+\.\d+\.\d+\.\d+$/.test(q))return go('host',q);
 if(DATA.some(function(e){return e.tunnel===q}))return go('tunnel',q);
 if(DATA.some(function(e){return e.rule===q}))return go('rule',q);
 setFilters({tokens:[{k:'text',v:q}]});go('explore');
});

document.body.addEventListener('click',function(ev){
 var t=ev.target;
 var tb=t.closest('[data-tab]');if(tb){setFilters({});S.route={n:tb.dataset.tab};S.sel=null;return render()}
 var ins=t.closest('[data-ins]');if(ins){var i=insights()[+ins.dataset.ins];
   if(i.go[0]==='explore'){setFilters(i.go[1]);return go('explore')}
   return go(i.go[0],i.go[1])}
 var vw=t.closest('[data-view]');if(vw){setFilters(VIEWS[+vw.dataset.view].f());return go('explore')}
 var hs=t.closest('[data-host]');if(hs)return go('host',hs.dataset.host);
 var rl=t.closest('[data-rule]');if(rl)return go('rule',rl.dataset.rule);
 var tn=t.closest('[data-tunnel]');if(tn)return go('tunnel',tn.dataset.tunnel);
 var es=t.closest('[data-explore-src]');if(es){setFilters({tokens:[{k:'src',v:es.dataset.exploreSrc}]});return go('explore')}
 var er=t.closest('[data-explore-rule]');if(er){setFilters({tokens:[{k:'rule',v:er.dataset.exploreRule}]});return go('explore')}
 var et=t.closest('[data-explore-tunnel]');if(et){setFilters({tokens:[{k:'tunnel',v:et.dataset.exploreTunnel}]});return go('explore')}
 var ee=t.closest('[data-explore-event]');if(ee){setFilters({tokens:[{k:'event',v:ee.dataset.exploreEvent}]});return go('explore')}
 if(t.closest('[data-live]'))return go('live');
 if(t.closest('[data-clear]')){setFilters({});return render()}
 if(t.closest('[data-lease]')){var st=document.getElementById('hint');if(st)st.textContent='nessun lease per quell\'indirizzo';return}
 var rm=t.closest('[data-rm]');if(rm){S.tokens.splice(+rm.dataset.rm,1);S.sel=null;return render()}
 var fx=t.closest('.fx');if(fx){var k=fx.dataset.fk,v=fx.dataset.fv,ix=S[k].indexOf(v);if(ix>-1)S[k].splice(ix,1);else S[k].push(v);S.sel=null;return render()}
 if(t.closest('#clrr')){S.range=null;return render()}
 if(t.closest('#pp')){S.live=!S.live;if(S.live)lt=setInterval(tick,1000);else clearInterval(lt);return render()}
 if(t.closest('#deg')){S.deg=!S.deg;return render()}
 if(t.closest('#dc')){S.sel=null;return render()}
 if(t.closest('#perma')){var hh=document.getElementById('hint');if(hh)hh.textContent='link copiato negli appunti';return}
 var scn=t.closest('[data-scen]');if(scn){var sp=SCEN[+scn.dataset.scen];
   S.sim={src:sp.src,dst:sp.dst,dport:sp.dport,proto:sp.proto,iface:sp.iface,res:null,trace:false,tracing:false};
   S.sim.res=simulate(S.sim);return render()}
 if(t.closest('#simrun')){readSim();S.sim.trace=false;S.sim.res=simulate(S.sim);return render()}
 if(t.closest('#simtrace')){readSim();S.sim.tracing=true;S.sim.res=null;render();
   setTimeout(function(){S.sim.tracing=false;S.sim.trace=true;S.sim.res=simulate(S.sim);render()},2200);return}
 var sim=t.closest('[data-sim]');if(sim){var d=sim.dataset;
   S.sim={src:d.simSrc||'',dst:d.simDst||'',dport:d.simDport||'',proto:d.simProto||'tcp',iface:d.simIface||'eth0',trace:false,tracing:false};
   S.sim.res=simulate(S.sim);return go('simulate')}
 if(t.closest('[data-simev]')){setFilters({tokens:[{k:'src',v:S.sim.src},{k:'port',v:String(S.sim.dport)}]});return go('explore')}
 var r=t.closest('tr.r');if(r){var idv=+r.dataset.id;S.sel=(S.sel===idv?null:idv);return render()}
});
document.body.addEventListener('change',function(ev){
 if(ev.target.id==='scope'){S.scope=ev.target.value;render()}
});
document.body.addEventListener('keydown',function(ev){
 if(ev.target.id==='q'&&ev.key==='Enter'){
  var s=ev.target.value.trim();if(!s)return;
  var m=s.match(/^(src|dst|host|rule|tunnel|action|port|user)\s*=\s*(.+)$/i);
  S.tokens.push(m?{k:m[1].toLowerCase(),v:m[2].trim()}:{k:'text',v:s});
  S.sel=null;render();var q=document.getElementById('q');if(q)q.focus();
 }
 if(ev.key==='Escape'){S.sel=null;render()}
});
var drg=null;
document.body.addEventListener('mousedown',function(ev){var b=ev.target.closest('.hb');if(!b)return;drg=[+b.dataset.m,+b.dataset.m];ev.preventDefault()});
document.body.addEventListener('mousemove',function(ev){
 if(!drg)return;var b=ev.target.closest('.hb');if(!b)return;drg[1]=+b.dataset.m;
 var a=Math.min(drg[0],drg[1]),z=Math.max(drg[0],drg[1]);
 var all=document.querySelectorAll('.hb');
 for(var i=0;i<all.length;i++){var m=+all[i].dataset.m;if(m<a||m>z)all[i].classList.add('off');else all[i].classList.remove('off')}
});
window.addEventListener('mouseup',function(){
 if(!drg)return;var a=Math.min(drg[0],drg[1]),z=Math.max(drg[0],drg[1]);drg=null;
 S.range=(S.range&&S.range[0]===a&&S.range[1]===z)?null:[a,z];S.sel=null;render();
});

for(var i=0;i<8;i++)tick();
lt=setInterval(tick,1000);
render();
</script>
</body>
</html>
